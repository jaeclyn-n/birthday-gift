<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Letter</title>

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <!-- Amplop -->
        <div class="envelope-wrapper">

            <img src="assests/flower-left.png.png" class="flower-img flower-left-png" alt="flower left">
            <img src="assests/flower-right.png -.png" class="flower-img flower-right-png" alt="flower right">
            <div class="teddy-bear">🧸</div>

            <div class="envelope" onclick="openLetter()">

                <div class="base"></div>

                <div class="top"></div>

                <div class="letter">

                    <div class="flower flower-left flower-top-1"><span>🌷</span><span>🌷</span><span>🌷</span></div>
                    <div class="flower flower-right flower-top-1"><span>🌷</span><span>🌷</span><span>🌷</span></div>
                    <div class="flower flower-left flower-top-2"><span>🌷</span><span>🌷</span><span>🌷</span></div>
                    <div class="flower flower-right flower-top-2"><span>🌷</span><span>🌷</span><span>🌷</span></div>
                    <div class="flower flower-left flower-top-3"><span>🌷</span><span>🌷</span><span>🌷</span></div>
                    <div class="flower flower-right flower-top-3"><span>🌷</span><span>🌷</span><span>🌷</span></div>

                    <h1>🎂 Happy Birthday!! 💖</h1>

                    <div class="letter-body">
                        <p id="typing"></p>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Tombol Musik -->
    <button class="music-btn" onclick="toggleMusic()">
        🎵 Music
    </button>

    <!-- Musik -->
    <audio id="music" loop>
        <source src="music/clair-de-lune.mp3.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script src="script.js"></script>

</body>

</html>
